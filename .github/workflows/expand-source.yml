name: Expand Flutter source
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  expand:
    if: github.event_name == 'workflow_dispatch' || hashFiles('topic12_provider_dashboard.zip') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract project
        run: |
          if [ ! -f topic12_provider_dashboard.zip ]; then
            echo "No source archive found; skipping."
            exit 0
          fi
          unzip -o topic12_provider_dashboard.zip -d /tmp/topic12
          cp -R /tmp/topic12/topic12_provider_dashboard/. .
          rm topic12_provider_dashboard.zip
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Flutter project source into repository" || exit 0
          git push
